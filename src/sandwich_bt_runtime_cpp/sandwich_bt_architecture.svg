<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Sandwich BT Stack Architecture</title>
  <desc id="desc">Layered architecture of the sandwich Behavior Tree stack with supervisor, collaborative runner, BehaviorTree.CPP runtime, ROS2 service boundaries, Python skill server, and human executor.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <style>
      .title { font: 700 32px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1a202c; }
      .subtitle { font: 400 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #4a5568; }
      .section { font: 700 18px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1a202c; }
      .label { font: 700 17px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1a202c; }
      .body { font: 400 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #2d3748; }
      .small { font: 400 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #4a5568; }
      .boundary { font: 700 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #2b6cb0; }
      .warning { font: 700 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #975a16; }
      .card { stroke-width: 2; rx: 14; ry: 14; }
      .shadow { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.06)); }
      .mono { font: 600 13px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; fill: #1a202c; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="url(#bg)"/>

  <text x="70" y="64" class="title">Sandwich BT Stack Architecture</text>
  <text x="70" y="94" class="subtitle">Closed-set supervisor above a reactive BehaviorTree.CPP runtime. The BT owns retry/recovery; the Python server owns skill execution; the human path stays explicit.</text>

  <rect x="60" y="132" width="1480" height="760" rx="20" ry="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="96" y="174" class="section">Planning and Observation Layer</text>
  <rect class="card shadow" x="90" y="196" width="430" height="150" fill="#ebf8ff" stroke="#90cdf4"/>
  <text x="112" y="226" class="label">Scene Provider / Future VLM</text>
  <text x="112" y="252" class="body">Produces a closed-set observation only:</text>
  <text x="132" y="278" class="mono">first_toast_on_plate</text>
  <text x="132" y="300" class="mono">ingredient_on_first_toast</text>
  <text x="132" y="322" class="mono">second_toast_on_top</text>
  <text x="112" y="338" class="small">No motion control. No direct robot commands.</text>

  <rect class="card shadow" x="560" y="196" width="450" height="150" fill="#faf5ff" stroke="#d6bcfa"/>
  <text x="582" y="226" class="label">sandwich_bt_supervisor</text>
  <text x="582" y="252" class="body">Chooses the next closed-set step and actor:</text>
  <text x="602" y="278" class="mono">robot | human | done | abort</text>
  <text x="582" y="304" class="body">Verifies whether the observed scene matches the expected state.</text>
  <text x="582" y="330" class="small">Owns scene-state estimation, task allocation, human handoff, verification.</text>

  <path d="M 520 271 L 560 271" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="532" y="258" class="small">closed-set observation</text>

  <rect class="card shadow" x="1060" y="196" width="430" height="150" fill="#fffaf0" stroke="#f6ad55"/>
  <text x="1082" y="226" class="label">collaborative_runner</text>
  <text x="1082" y="252" class="body">Operational loop:</text>
  <text x="1102" y="278" class="body">1. observe</text>
  <text x="1180" y="278" class="body">2. plan via ROS2</text>
  <text x="1312" y="278" class="body">3. execute</text>
  <text x="1102" y="302" class="body">4. verify via ROS2</text>
  <text x="1246" y="302" class="body">5. continue or abort</text>
  <text x="1082" y="330" class="small">Talks to the supervisor only through service boundaries.</text>

  <path d="M 1010 271 L 1060 271" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1018" y="258" class="small">PlanNextStep / VerifyStep</text>

  <text x="96" y="404" class="section">Execution Layer</text>

  <rect class="card shadow" x="90" y="428" width="430" height="240" fill="#f0fff4" stroke="#68d391"/>
  <text x="112" y="458" class="label">Human Path</text>
  <text x="112" y="486" class="body">HumanCommandExecutor</text>
  <text x="132" y="512" class="body">- send instruction</text>
  <text x="132" y="536" class="body">- wait for confirmation</text>
  <text x="132" y="560" class="body">- verify resulting scene</text>
  <text x="112" y="596" class="body">Example step:</text>
  <text x="132" y="620" class="mono">pour_ingredient</text>
  <text x="112" y="648" class="warning">Fails explicitly if confirmation or scene verification fails.</text>

  <rect class="card shadow" x="560" y="428" width="470" height="240" fill="#ebf4ff" stroke="#63b3ed"/>
  <text x="582" y="458" class="label">Robot Path</text>
  <text x="582" y="486" class="body">BtXmlRobotExecutor</text>
  <text x="602" y="512" class="body">- parses subtree XML</text>
  <text x="602" y="536" class="body">- supports</text>
  <text x="696" y="536" class="mono">Sequence</text>
  <text x="776" y="536" class="body">,</text>
  <text x="790" y="536" class="mono">RetryUntilSuccessful</text>
  <text x="602" y="560" class="body">- invokes</text>
  <text x="686" y="560" class="mono">RunNamedCommand</text>
  <text x="804" y="560" class="body">through a pluggable backend</text>
  <text x="582" y="596" class="body">Backends:</text>
  <text x="602" y="620" class="mono">in-process</text>
  <text x="696" y="620" class="body">or</text>
  <text x="728" y="620" class="mono">ros2</text>
  <text x="774" y="620" class="body">for</text>
  <text x="804" y="620" class="mono">/sandwich_bt/run_command</text>
  <text x="582" y="648" class="small">Used by the collaborative runner for robot-owned steps.</text>

  <rect class="card shadow" x="1080" y="428" width="410" height="240" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="1102" y="458" class="label">sandwich_bt_runtime_cpp</text>
  <text x="1102" y="486" class="body">BehaviorTree.CPP runtime</text>
  <text x="1122" y="512" class="body">- load XML tree</text>
  <text x="1122" y="536" class="body">- tick until success/failure</text>
  <text x="1122" y="560" class="body">- local retry / recovery</text>
  <text x="1122" y="584" class="body">- optional Groot publisher</text>
  <text x="1102" y="620" class="body">Entry points:</text>
  <text x="1122" y="644" class="mono">sandwich_bt_main.cpp</text>
  <text x="1122" y="666" class="mono">RunNamedCommandNode</text>

  <path d="M 1275 346 L 1275 428" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1290" y="390" class="small">robot step selected</text>
  <path d="M 1275 668 L 1275 740" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M 1060 548 L 1030 548" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1038" y="535" class="small">subtree semantics</text>

  <path d="M 1275 668 L 1275 740" stroke="#4a5568" stroke-width="0"/>

  <text x="96" y="728" class="section">ROS2 Boundary and Skill Execution</text>

  <rect class="card shadow" x="90" y="752" width="360" height="110" fill="#e6fffa" stroke="#4fd1c5"/>
  <text x="112" y="782" class="label">ROS2 Service Boundary</text>
  <text x="112" y="808" class="mono">/sandwich_bt/run_command</text>
  <text x="112" y="834" class="boundary">RunNamedCommand.srv</text>

  <rect class="card shadow" x="500" y="722" width="510" height="170" fill="#fff5f5" stroke="#fc8181"/>
  <text x="522" y="752" class="label">sandwich_bt_python</text>
  <text x="522" y="780" class="body">Python command server and executor</text>
  <text x="542" y="806" class="body">- expose</text>
  <text x="606" y="806" class="mono">/sandwich_bt/run_command</text>
  <text x="542" y="830" class="body">- dispatch one named</text>
  <text x="690" y="830" class="mono">skill</text>
  <text x="728" y="830" class="body">or</text>
  <text x="754" y="830" class="mono">recovery</text>
  <text x="542" y="854" class="body">- return</text>
  <text x="610" y="854" class="mono">success / status / elapsed_s / message</text>
  <text x="522" y="878" class="small">Can run either the real skill server or the mock skill simulator.</text>

  <rect class="card shadow" x="1060" y="722" width="430" height="170" fill="#fefcbf" stroke="#ecc94b"/>
  <text x="1082" y="752" class="label">Robot / Mock Backend</text>
  <text x="1082" y="780" class="body">- ACT / GR00T checkpoint execution</text>
  <text x="1082" y="804" class="body">- scripted recoveries</text>
  <text x="1082" y="828" class="body">- or</text>
  <text x="1114" y="828" class="mono">lerobot-bt-skill-sim --ros2-service</text>
  <text x="1082" y="864" class="warning">Current validated status: mock skill server and C++ BT runner.</text>

  <path d="M 450 808 L 500 808" stroke="#2b6cb0" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M 1010 808 L 1060 808" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M 1275 668 L 1275 722" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1290" y="700" class="small">RunNamedCommand leaf</text>

  <path d="M 275 668 L 275 752" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="292" y="712" class="small">human confirmation and verification</text>

  <rect x="1158" y="106" width="382" height="64" rx="12" ry="12" fill="#fffaf0" stroke="#f6ad55" stroke-width="2"/>
  <text x="1180" y="134" class="label">Rule</text>
  <text x="1180" y="158" class="small">The BT does not choose the next semantic step. It executes, fails, retries, and reports.</text>
</svg>
