<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">sandwich_bt_python input output flow</title>
  <desc id="desc">Diagramma del pacchetto sandwich_bt_python con input, flusso interno, ramo skill, verifica VLM e output verso BT e robot.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 28px monospace; fill: #111827; }
      .subtitle { font: 400 16px monospace; fill: #374151; }
      .section { font: 700 18px monospace; fill: #111827; }
      .label { font: 700 16px monospace; fill: #111827; }
      .body { font: 400 14px monospace; fill: #111827; }
      .small { font: 400 13px monospace; fill: #374151; }
      .box { stroke: #1f2937; stroke-width: 2; rx: 16; ry: 16; }
      .line { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#f8fafc"/>

  <text x="60" y="60" class="title">sandwich_bt_python: cosa prende in input e cosa produce in output</text>
  <text x="60" y="88" class="subtitle">Package role: riceve un comando dal BT, lo risolve come skill o gate simulato, interagisce con robot/dummy backend, restituisce un esito ROS2.</text>

  <text x="60" y="135" class="section">INPUT</text>
  <text x="510" y="135" class="section">CORE PACKAGE</text>
  <text x="1120" y="135" class="section">OUTPUT</text>

  <rect class="box" x="50" y="160" width="330" height="150" fill="#dbeafe"/>
  <text x="70" y="190" class="label">1) Request dal BT runtime</text>
  <text x="70" y="220" class="body">Caller: sandwich_bt_runtime_cpp</text>
  <text x="70" y="245" class="body">Service: /sandwich_bt/run_command</text>
  <text x="70" y="270" class="body">Payload:</text>
  <text x="95" y="295" class="body">kind</text>
  <text x="155" y="295" class="body">name</text>
  <text x="215" y="295" class="body">timeout_s</text>

  <rect class="box" x="50" y="340" width="330" height="230" fill="#dcfce7"/>
  <text x="70" y="370" class="label">2) Config YAML</text>
  <text x="70" y="400" class="body">File tipici:</text>
  <text x="95" y="425" class="small">sandwich_bt_executor.yaml</text>
  <text x="95" y="448" class="small">sandwich_bt_executor_headless.yaml</text>
  <text x="70" y="480" class="body">Definisce:</text>
  <text x="95" y="505" class="body">service_name</text>
  <text x="95" y="528" class="body">robot config</text>
  <text x="95" y="551" class="body">skills[] con policy/checkpoint</text>
  <text x="95" y="574" class="body">servizi di verifica VLM</text>

  <rect class="box" x="50" y="600" width="330" height="180" fill="#fef3c7"/>
  <text x="70" y="630" class="label">3) Backend robot / mock</text>
  <text x="70" y="660" class="body">server.py costruisce CustomManipulator</text>
  <text x="70" y="685" class="body">da cfg.robot</text>
  <text x="70" y="715" class="body">Real mode:</text>
  <text x="180" y="715" class="body">panda + robotiq + camere</text>
  <text x="70" y="740" class="body">Headless:</text>
  <text x="180" y="740" class="body">dummy arm + dummy gripper</text>

  <rect class="box" x="470" y="160" width="430" height="140" fill="#e0e7ff"/>
  <text x="495" y="192" class="label">server.py / SkillCommandServer</text>
  <text x="495" y="220" class="body">Espone il service ROS2 e riceve la request.</text>
  <text x="495" y="245" class="body">Costruisce robot, processor pipeline e executor.</text>
  <text x="495" y="270" class="body">Dispatch:</text>
  <text x="595" y="270" class="body">kind == skill</text>
  <text x="760" y="270" class="body">oppure</text>
  <text x="825" y="270" class="body">kind simulato</text>

  <rect class="box" x="470" y="330" width="430" height="165" fill="#ede9fe"/>
  <text x="495" y="362" class="label">executor.py / SkillCommandExecutor</text>
  <text x="495" y="390" class="body">Input interni:</text>
  <text x="620" y="390" class="body">cfg</text>
  <text x="670" y="390" class="body">robot</text>
  <text x="745" y="390" class="body">processor pipeline</text>
  <text x="495" y="420" class="body">Risoluzione per nome:</text>
  <text x="710" y="420" class="body">skill_configs[name]</text>
  <text x="495" y="450" class="body">oppure</text>
  <text x="580" y="450" class="body">nessun recovery deterministico</text>
  <text x="495" y="480" class="body">Output interno comune:</text>
  <text x="730" y="480" class="body">CommandResult</text>

  <rect class="box" x="450" y="545" width="470" height="305" fill="#dbeafe"/>
  <text x="475" y="578" class="label">Skill branch</text>
  <text x="475" y="608" class="body">A) carica o riusa SkillRuntime cache:</text>
  <text x="510" y="633" class="body">dataset metadata</text>
  <text x="700" y="633" class="body">policy</text>
  <text x="780" y="633" class="body">pre/postprocessor</text>
  <text x="475" y="668" class="body">B) loop di controllo:</text>
  <text x="510" y="693" class="body">robot.get_observation()</text>
  <text x="510" y="718" class="body">robot_observation_processor(obs)</text>
  <text x="510" y="743" class="body">conditions.py decide RUNNING / SUCCESS / FAILURE</text>
  <text x="510" y="768" class="body">predict_action(...) con la policy</text>
  <text x="510" y="793" class="body">make_robot_action(...)</text>
  <text x="510" y="818" class="body">robot_action_processor((action, obs))</text>
  <text x="510" y="843" class="body">robot.send_action(...)</text>

  <rect class="box" x="950" y="545" width="320" height="250" fill="#fee2e2"/>
  <text x="975" y="578" class="label">VLM retry rule</text>
  <text x="975" y="608" class="body">Il server apre un attempt PENDING.</text>
  <text x="975" y="638" class="body">Il VLM riporta SUCCESS o FAILURE.</text>
  <text x="975" y="668" class="body">Su FAILURE il BT ritenta</text>
  <text x="975" y="693" class="body">la stessa skill BC da capo.</text>

  <rect class="box" x="1080" y="190" width="270" height="165" fill="#dcfce7"/>
  <text x="1105" y="222" class="label">Output 1: risposta al BT</text>
  <text x="1105" y="252" class="body">ROS2 response:</text>
  <text x="1130" y="280" class="body">success</text>
  <text x="1215" y="280" class="body">status</text>
  <text x="1288" y="280" class="body">elapsed_s</text>
  <text x="1130" y="308" class="body">message</text>
  <text x="1105" y="338" class="small">Il BT converte success=True in SUCCESS,</text>
  <text x="1105" y="358" class="small">success=False in FAILURE.</text>

  <rect class="box" x="1080" y="390" width="270" height="190" fill="#fef3c7"/>
  <text x="1105" y="422" class="label">Output 2: side effect sul robot</text>
  <text x="1105" y="452" class="body">Skill path:</text>
  <text x="1215" y="452" class="body">azioni predette dalla policy</text>
  <text x="1105" y="482" class="body">VLM failure:</text>
  <text x="1245" y="482" class="body">retry skill da BT</text>
  <text x="1105" y="512" class="body">In headless mode i side effect vanno</text>
  <text x="1105" y="537" class="body">sul backend dummy, non su hardware reale.</text>

  <rect class="box" x="1080" y="615" width="270" height="160" fill="#e0e7ff"/>
  <text x="1105" y="647" class="label">Output 3: telemetria / debug</text>
  <text x="1105" y="677" class="body">log python</text>
  <text x="1105" y="702" class="body">eventuale Rerun visualization</text>
  <text x="1105" y="727" class="body">warning su control frequency</text>

  <path class="line" d="M380 235 L470 235"/>
  <path class="line" d="M380 455 L470 455"/>
  <path class="softline dashed" d="M380 690 L470 690"/>
  <path class="line" d="M900 235 L1080 235"/>
  <path class="line" d="M900 412 L1080 412"/>
  <path class="line" d="M685 495 L685 545"/>
  <path class="line" d="M900 412 L950 412 L950 600"/>
  <path class="line" d="M920 700 L1080 700"/>
  <path class="line" d="M1270 660 L1270 580"/>
  <path class="line" d="M1270 580 L1270 390"/>

  <text x="60" y="900" class="section">Riassunto</text>
  <text x="60" y="930" class="body">Input principali:</text>
  <text x="245" y="930" class="body">request ROS2 dal BT, config YAML, backend robot reale o dummy.</text>
  <text x="60" y="955" class="body">Output principali:</text>
  <text x="255" y="955" class="body">risposta ROS2 al BT + movimenti/azioni sul robot + log e telemetria.</text>
</svg>
