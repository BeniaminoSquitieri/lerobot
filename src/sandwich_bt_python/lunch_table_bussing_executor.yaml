# @file lunch_table_bussing_executor.yaml
# @brief Real-robot Python execution config for lunch_table_bussing.xml.
#
# To connect real BC models, replace only the policy.pretrained_path values in
# the skill entries below. Skill names must stay aligned with the BT XML.

bt_command_service: "/sandwich_bt/run"
vlm_state_service: "/sandwich_bt/vlm_state"
legacy_vlm_result_service: "/sandwich_bt/vlm_result_legacy"
vlm_request_topic: "/sandwich_bt/vlm_request"
vlm_result_topic: "/sandwich_bt/vlm_result"
vlm_timeout_s: 0.0

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: pick_and_dispose_trash
    dataset_repo_id: "scene-transition/pick_and_dispose_trash"
    metadata_source: robot
    task: "Pick one loose trash item from the table and place it in the trash bin."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_PICK_AND_DISPOSE_TRASH"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: clear_plate
    dataset_repo_id: "scene-transition/clear_plate"
    metadata_source: robot
    task: "Move one plate to the dishware container and dispose visible trash from it."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_CLEAR_PLATE"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: pick_and_store_cutlery
    dataset_repo_id: "scene-transition/pick_and_store_cutlery"
    metadata_source: robot
    task: "Pick one cutlery item from the table and place it in the cutlery container."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_PICK_AND_STORE_CUTLERY"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: pick_and_store_dishware
    dataset_repo_id: "scene-transition/pick_and_store_dishware"
    metadata_source: robot
    task: "Pick one glass, cup, or bowl from the table and place it in the dishware container."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_PICK_AND_STORE_DISHWARE"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0
