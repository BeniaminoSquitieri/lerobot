# @file sandwich_bt_executor_headless.yaml
# @brief Headless/mock Python execution layer configuration.
#
# This profile uses dummy arm and gripper backends so tests can exercise the
# service boundary without physical hardware.

# ROS2 service used by RunNamedCommand BT leaves.
bt_command_service: "/sandwich_bt/run"
# ROS2 service used by VerifySkillOutcome BT leaves.
vlm_state_service: "/sandwich_bt/vlm_state"
# Legacy ROS2 service for external verifier verdicts.
legacy_vlm_result_service: "/sandwich_bt/vlm_result_legacy"
# Topic published when the BT needs a scene verdict.
vlm_request_topic: "/sandwich_bt/vlm_request"
# Topic consumed from manual tests or the real VLM.
vlm_result_topic: "/sandwich_bt/vlm_result"
# If the verifier does not report SUCCESS before this deadline, the attempt
# becomes FAILURE so tests do not wait forever.
vlm_timeout_s: 5.0

# Mock robot configuration for headless/simulator mode.
robot:
  arm:
    type: dummy
  gripper:
    type: dummy
  cameras: {}

# Lightweight runtime toggles for non-interactive test execution.
fps: 10
display_data: false
play_sounds: false
reset_robot_on_startup: false
rename_map: {}

# Robot-side processors used before sending actions / after reading observations.
robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

# Minimal learned-primitive placeholder for service and config tests.
skills:
  - name: test_skill
    dataset_repo_id: "HSP-IIT/toast_pick_and_place"
    task: "Test skill"
    policy:
      type: act
      device: cpu
      pretrained_path: "HSP-IIT/act_toast_pick_and_place"
      n_action_steps: 4
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 5.0
    settle_time_s: 0.0
