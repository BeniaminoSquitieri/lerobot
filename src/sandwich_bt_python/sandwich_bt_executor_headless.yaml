# @file sandwich_bt_executor_headless.yaml
# @brief Headless/mock Python execution layer configuration.
#
# This profile uses dummy arm and gripper backends so tests can exercise the
# service boundary without physical hardware.

# ROS2 service used by RunNamedCommand BT leaves.
service_name: "/sandwich_bt/run_command"
# ROS2 service used by VerifySkillOutcome BT leaves.
verification_query_service_name: "/sandwich_bt/get_skill_verification"
# ROS2 service used by external VLM/operator verdict publishers.
verification_report_service_name: "/sandwich_bt/report_skill_verification"

# Mock robot configuration for headless/simulator mode.
robot:
  arm:
    type: dummy
  gripper:
    type: dummy
  cameras: {}

# Lightweight runtime toggles for non-interactive test execution.
fps: 10
display_data: false
play_sounds: false
reset_robot_on_startup: false
rename_map: {}

# Robot-side processors used before sending actions / after reading observations.
robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

# Minimal learned-primitive placeholder for service and config tests.
skills:
  - name: test_skill
    dataset_repo_id: "HSP-IIT/toast_pick_and_place"
    task: "Test skill"
    policy:
      type: act
      device: cpu
      pretrained_path: "HSP-IIT/act_toast_pick_and_place"
      n_action_steps: 4
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 5.0
    settle_time_s: 0.0

# Scripted recoveries used by the BT between failed attempts.
recoveries:
  - name: recover_test
    # A tiny pause is enough to exercise the recovery execution path in tests.
    steps:
      - kind: pause
        duration_s: 0.1
