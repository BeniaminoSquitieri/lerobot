# Python execution layer configuration - HEADLESS/MOCK MODE
# Uses dummy arm and gripper for testing without physical hardware

service_name: "/sandwich_bt/run_command"

# Mock robot configuration for headless/simulator mode
robot:
  arm:
    type: dummy
  gripper:
    type: dummy
  cameras: {}

fps: 10
display_data: false
play_sounds: false
reset_robot_on_startup: false
rename_map: {}

# Robot-side processors used before sending actions / after reading observations.
robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

# Learned primitives - minimal test config
# Note: These are placeholders; actual skills would require real checkpoints
skills:
  - name: test_skill
    dataset_repo_id: "HSP-IIT/toast_pick_and_place"
    task: "Test skill"
    policy:
      type: act
      device: cpu
      pretrained_path: "HSP-IIT/act_toast_pick_and_place"
      n_action_steps: 4
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 5.0
    settle_time_s: 0.0

# Scripted recoveries used by the BT between failed attempts.
recoveries:
  - name: recover_test
    steps:
      - kind: pause
        duration_s: 0.1
