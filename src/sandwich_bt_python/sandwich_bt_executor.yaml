# @file sandwich_bt_executor.yaml
# @brief Real-robot Python execution layer configuration.
#
# Flow role:
# 1. The C++ BT sends a named command.
# 2. The Python server resolves the name using this file.
# 3. The corresponding learned skill is executed on the robot.

# ROS2 service used by RunNamedCommand BT leaves.
bt_command_service: "/sandwich_bt/run"
# ROS2 service used by VerifySkillOutcome BT leaves.
vlm_state_service: "/sandwich_bt/vlm_state"
# Legacy ROS2 service for external verifier verdicts.
legacy_vlm_result_service: "/sandwich_bt/vlm_result_legacy"
# Topic published when the BT needs a scene verdict.
vlm_request_topic: "/sandwich_bt/vlm_request"
# Topic consumed from manual tests or the real VLM.
vlm_result_topic: "/sandwich_bt/vlm_result"
# If the VLM/manual verifier does not report SUCCESS before this deadline,
# the attempt is marked FAILURE and the BT retry wrapper reruns the skill.
vlm_timeout_s: 0.0

# Startup validation: these BT-requested skill names must exist below.
expected_skill_names:
  - place_first_toast
  - place_second_toast

# Startup validation: these camera entries must exist in robot.cameras.
required_cameras:
  - wrist
  - left

# Real robot hardware configuration used by the Python server.
robot:
  # Franka Panda arm backend configured through LeRobot.
  arm:
    type: panda
    visualize: true
  # Robotiq gripper backend configured through LeRobot.
  gripper:
    type: robotiq
  # Camera names become observation keys available to learned policies.
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

# Control-loop frame rate used while rolling out learned policies.
fps: 10
# Display/logging toggles used by LeRobot rollout helpers.
display_data: true
play_sounds: true
# Robot reset behavior before server startup and before individual skills.
reset_robot_on_startup: true
reset_robot_before_skill: true
# Optional mapping from policy feature names to connected robot feature names.
rename_map: {}

# Robot-side processors used before sending actions / after reading observations.
robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

# Learned primitives.
# Each entry points to policy metadata and its trained ACT checkpoint.
skills:
  - name: place_first_toast
    # Matches cfgs/rollout_panda_robotiq.yaml. With metadata_source=robot,
    # this id is only a label; features are built from the connected robot like record.py.
    dataset_repo_id: "HSP-IIT/eval_act_toast_pick_and_place"
    metadata_source: robot
    task: "Pick the toast upon the table."
    policy:
      type: act
      device: cuda
      pretrained_path: "HSP-IIT/act_toast_pick_and_place"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 12000.0
    settle_time_s: 0.0

  - name: place_second_toast
    # Matches the real top-toast placement primitive. With metadata_source=robot,
    # this id is only a label; features are built from the connected robot like record.py.
    dataset_repo_id: "HSP-IIT/eval_act_pick_place_2nd"
    metadata_source: robot
    task: "Pick the second toast and place it on top of the prepared sandwich."
    policy:
      type: act
      device: cuda
      pretrained_path: "HSP-IIT/act_pick_place_2nd"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 12000.0
    settle_time_s: 0.0
