# @file items_in_drawer_executor.yaml
# @brief Real-robot Python execution config for items_in_drawer.xml.
#
# To connect real BC models, replace only the policy.pretrained_path values in
# the skill entries below. Skill names must stay aligned with the BT XML.

bt_command_service: "/sandwich_bt/run"
vlm_state_service: "/sandwich_bt/vlm_state"
legacy_vlm_result_service: "/sandwich_bt/vlm_result_legacy"
vlm_request_topic: "/sandwich_bt/vlm_request"
vlm_result_topic: "/sandwich_bt/vlm_result"
vlm_timeout_s: 0.0

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: open_drawer
    dataset_repo_id: "scene-transition/open_drawer"
    metadata_source: robot
    task: "Grasp the drawer handle and open the drawer far enough to expose the inner space."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_OPEN_DRAWER"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0

  - name: pick_object_for_drawer
    dataset_repo_id: "scene-transition/pick_object_for_drawer"
    metadata_source: robot
    task: "Pick one object from the workspace for drawer insertion."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_PICK_OBJECT_FOR_DRAWER"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0

  - name: insert_object_in_drawer
    dataset_repo_id: "scene-transition/insert_object_in_drawer"
    metadata_source: robot
    task: "Place the grasped object inside the open drawer without blocking the drawer edges."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_INSERT_OBJECT_IN_DRAWER"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0

  - name: close_drawer
    dataset_repo_id: "scene-transition/close_drawer"
    metadata_source: robot
    task: "Push the drawer closed after the objects have been inserted."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_CLOSE_DRAWER"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0
