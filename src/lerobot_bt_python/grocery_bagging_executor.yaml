# @file grocery_bagging_executor.yaml
# @brief Real-robot Python execution config for grocery_bagging.xml.
#
# To connect real BC models, replace only the policy.pretrained_path values in
# the skill entries below. Skill names must stay aligned with the BT XML.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

expected_skill_names:
  - bag_rigid_or_cylindrical_item
  - bag_flat_or_long_item
  - bag_soft_or_fragile_item

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: bag_rigid_or_cylindrical_item
    dataset_repo_id: "scene-transition/bag_rigid_or_cylindrical_item"
    metadata_source: robot
    task: "Pick one rigid or cylindrical grocery item and place it inside the open bag."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_BAG_RIGID_OR_CYLINDRICAL_ITEM"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: bag_flat_or_long_item
    dataset_repo_id: "scene-transition/bag_flat_or_long_item"
    metadata_source: robot
    task: "Pick one flat or long grocery item and place it inside the open bag."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_BAG_FLAT_OR_LONG_ITEM"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: bag_soft_or_fragile_item
    dataset_repo_id: "scene-transition/bag_soft_or_fragile_item"
    metadata_source: robot
    task: "Pick one soft or fragile grocery item and place it inside the open bag gently."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_BAG_SOFT_OR_FRAGILE_ITEM"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0
