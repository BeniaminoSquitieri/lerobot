# @file set_breakfast_table_executor.yaml
# @brief Real-robot Python execution config for the breakfast-table version of set_breakfast_table.xml.
#
# Each skill can choose its own policy_variant. The top-level policy_variant is
# only the default for skills that do not override it.
# Skill names must stay aligned with the BT XML.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act.
policy_variant: act

expected_skill_names:
  - place_cereal_box
  - place_bottle
  - place_cup
  - place_bowl

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: false
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

# Camera publishing for the external VLM verifier.
# The BT server opens the RealSense devices for policy inference and
# simultaneously publishes frames on these ROS topics so the VLM can
# subscribe without conflicting with the server.
camera_publish_map:
  wrist: "/panda/camera/front/image_compressed"
  left: "/panda/camera/wrist/image_compressed"
camera_publish_fps: 10.0
camera_publish_jpeg_quality: 80

# VLM gate descriptions (for AwaitScene nodes that have no policy config).
vlm_gate_tasks:
  breakfast_table.tablecloth_ready: "A white tablecloth is spread on the table."
  breakfast_table.tea_box_ready: "A tea box has been placed on the table."
  breakfast_table.spoon_ready: "A spoon has been placed on the table."
  breakfast_table.task_complete: "The breakfast table is fully set with all items: tablecloth, cereal box, tea box, bottle, cup, spoon, and bowl."

# Minimum wait time (seconds) before VLM checks human gates.
# Gives the operator time to place objects before the VLM verifies.
vlm_gate_min_wait_s: 5.0

# Force re-download of policy checkpoints on every server startup.
# Set to false only if you're offline and want to use cached models.
force_download_policy: true

skills:
  - name: place_cereal_box
    dataset_repo_id: "Squitieri/cereal_act16_100k"
    metadata_source: robot
    task: "The brown cereal box has been moved onto the white tablecloth."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "Squitieri/cereal_act16_100k"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 3.0

  - name: place_bottle
    dataset_repo_id: "Squitieri/bottleclean_act16_100k"
    metadata_source: robot
    task: "The green bottle is now on the white tablecloth."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "Squitieri/bottleclean_act16_100k"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 3.0

  - name: place_cup
    dataset_repo_id: "Squitieri/breakfast_pick_cup_new_act_chunk16_exec16_100k"
    metadata_source: robot
    task: "The red cup is now on the white tablecloth."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "Squitieri/breakfast_pick_cup_new_act_chunk16_exec16_100k"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 3.0

  - name: place_bowl
    dataset_repo_id: "Squitieri/bowl_act16_100k"
    metadata_source: robot
    task: "The red bowl is now on the white tablecloth."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "Squitieri/bowl_act16_100k"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 3.0
