# @file set_breakfast_table_executor.yaml
# @brief Real-robot Python execution config for the breakfast-table version of set_breakfast_table.xml.
#
# Each skill can choose its own policy_variant. The top-level policy_variant is
# only the default for skills that do not override it.
# Skill names must stay aligned with the BT XML.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act, smolvla, diffusion, groot, xvla, pi0, vqbet, tdmpc.
policy_variant: act

expected_skill_names:
  - place_cereal_box
  - place_bottle
  - place_cup
  - place_bowl

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

# Camera publishing for the external VLM verifier.
# The BT server opens the RealSense devices for policy inference and
# simultaneously publishes frames on these ROS topics so the VLM can
# subscribe without conflicting with the server.
camera_publish_map:
  wrist: "/panda/camera/front/image_compressed"
  left: "/panda/camera/wrist/image_compressed"
camera_publish_fps: 10.0
camera_publish_jpeg_quality: 80

# VLM gate descriptions (for AwaitScene nodes that have no policy config).
vlm_gate_tasks:
  breakfast_table.tablecloth_ready: "A tablecloth has been spread on the table."
  breakfast_table.tea_box_ready: "A tea box has been placed on the table."
  breakfast_table.spoon_ready: "A spoon has been placed on the table."
  breakfast_table.task_complete: "The breakfast table is fully set with all items: tablecloth, cereal box, tea box, bottle, cup, spoon, and bowl."

skills:
  - name: place_cereal_box
    dataset_repo_id: "Squitieri/cereal_act16_100k"
    metadata_source: robot
    task: "The cereal box is on the tablecloth."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "Squitieri/cereal_act16_100k"
        n_action_steps: 16
        chunk_size: 16
      smolvla:
        type: smolvla
        device: cuda
        pretrained_path: "TODO_SMOLVLA_PLACE_CEREAL_BOX"
        n_action_steps: 50
        chunk_size: 50
        num_steps: 10
      diffusion:
        type: diffusion
        device: cuda
        pretrained_path: "TODO_DIFFUSION_PLACE_CEREAL_BOX"
        n_action_steps: 8
        horizon: 16
      multi_task_dit:
        type: multi_task_dit
        device: cuda
        pretrained_path: "TODO_MULTI_TASK_DIT_PLACE_CEREAL_BOX"
        n_action_steps: 24
        horizon: 32
      vqbet:
        type: vqbet
        device: cuda
        pretrained_path: "TODO_VQBET_PLACE_CEREAL_BOX"
        n_obs_steps: 5
        n_action_pred_token: 3
        action_chunk_size: 5
      pi0:
        type: pi0
        device: cuda
        pretrained_path: "TODO_PI0_PLACE_CEREAL_BOX"
        n_action_steps: 50
        chunk_size: 50
      pi0_fast:
        type: pi0_fast
        device: cuda
        pretrained_path: "TODO_PI0_FAST_PLACE_CEREAL_BOX"
        n_action_steps: 50
        chunk_size: 50
      pi05:
        type: pi05
        device: cuda
        pretrained_path: "TODO_PI05_PLACE_CEREAL_BOX"
        n_action_steps: 50
        chunk_size: 50
      groot:
        type: groot
        device: cuda
        pretrained_path: "TODO_GROOT_PLACE_CEREAL_BOX"
        n_action_steps: 50
        chunk_size: 50
      xvla:
        type: xvla
        device: cuda
        pretrained_path: "TODO_XVLA_PLACE_CEREAL_BOX"
        n_action_steps: 32
        chunk_size: 32
      wall_x:
        type: wall_x
        device: cuda
        pretrained_path: "TODO_WALL_X_PLACE_CEREAL_BOX"
        n_action_steps: 32
        chunk_size: 32
      tdmpc:
        type: tdmpc
        device: cuda
        pretrained_path: "TODO_TDMPC_PLACE_CEREAL_BOX"
        n_action_steps: 1
        horizon: 5
        n_action_repeats: 2
      sac:
        type: sac
        device: cuda
        pretrained_path: "TODO_SAC_PLACE_CEREAL_BOX"
      reward_classifier:
        type: reward_classifier
        device: cuda
        pretrained_path: "TODO_REWARD_CLASSIFIER_PLACE_CEREAL_BOX"
      sarm:
        type: sarm
        device: cuda
        pretrained_path: "TODO_SARM_PLACE_CEREAL_BOX"
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

