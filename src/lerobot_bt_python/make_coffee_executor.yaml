# @file make_coffee_executor.yaml
# @brief Real-robot Python execution config for make_coffee.xml.
#
# To connect real BC models, replace only the policy.pretrained_path values in
# the skill entries below. Skill names must stay aligned with the BT XML.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

expected_skill_names:
  - pick_and_insert_capsule
  - close_coffee_machine

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: pick_and_insert_capsule
    dataset_repo_id: "scene-transition/pick_and_insert_capsule"
    metadata_source: robot
    task: "Pick the coffee capsule and insert it into the capsule slot."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_PICK_AND_INSERT_CAPSULE"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0

  - name: close_coffee_machine
    dataset_repo_id: "scene-transition/close_coffee_machine"
    metadata_source: robot
    task: "Close the coffee machine after the capsule has been inserted."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_CLOSE_COFFEE_MACHINE"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 30.0
    settle_time_s: 0.0
