# @file make_coffee_executor.yaml
# @brief Real-robot Python execution config for make_coffee.xml.
#
# Each skill can choose its own policy_variant. The top-level policy_variant is
# only the default for skills that do not override it.
# Skill names must stay aligned with the BT XML.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 60.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act.
policy_variant: act

expected_skill_names:
  - pick_and_insert_capsule
  - close_coffee_machine

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: true
      warmup_s: 5
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: true
      warmup_s: 5
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

camera_publish_map:
  wrist: "/panda/camera/wrist/image_compressed"
  left: "/panda/camera/front/image_compressed"
camera_depth_publish_map:
  wrist: "/panda/camera/wrist/depth"
  left: "/panda/camera/front/depth"
camera_info_publish_map:
  wrist: "/panda/camera/wrist/camera_info"
  left: "/panda/camera/front/camera_info"
camera_frame_id_map:
  wrist: "panda_wrist_camera"
  left: "panda_front_camera"
# Add calibrated hand-eye transforms in camera_static_tf_map before using
# object poses for grasping. Without real base_link->camera calibration, the
# perception node marks poses tf_unavailable and rejects robot-frame queries.
camera_publish_fps: 10.0
camera_publish_jpeg_quality: 80

# VLM gate descriptions (for AwaitScene nodes that have no policy config).
# These are used as the `task` field in VLM requests so the VLM knows what to check.
vlm_gate_tasks:
  make_coffee.scene_0_ready: "Verify that all required objects for the coffee task are present on the scene: the coffee machine, a coffee capsule in a white plate, and an empty cup. The cup is an orange cup and may appear small, tilted, partially occluded, or near the edge of a view; consider the cup present if you can see it in EITHER camera view."
  make_coffee.cup_under_dispenser: "Check if the empty cup (an orange cup) has been placed in the coffee machine's dispensing area, i.e. under or against the machine where the coffee will pour. Because of the camera angle the cup may look slightly offset to the side; answer SUCCESS as long as the orange cup is at/under the coffee machine base (in front of or beneath the dispenser), even if not perfectly centered under the nozzle. Answer RUNNING only if the orange cup is clearly far away on the table or still held by the gripper."
  make_coffee.human_press_start_button: "Check if the coffee machine is running and extraction has started (button pressed, water flowing)."

# Minimum wait time (seconds) before VLM checks human gates.
# Gives the operator time to place objects before the VLM verifies.
# 0.0 = check immediately and re-check as fast as inference allows, so the
# gate unblocks the instant the operator finishes.
vlm_gate_min_wait_s: 0.0

# Re-check cadence (seconds) the VLM verifier should honor while a ROBOT SKILL
# check stays non-final. 0.0 = re-evaluate the scene as fast as inference
# allows, so the robot stops the moment the skill is confirmed complete and
# does not keep rolling out the policy into strange post-task behavior.
skill_vlm_check_period_s: 0.0

# Re-check cadence (seconds) for HUMAN/VLM gates while the check stays
# non-final. 0.0 = re-evaluate the scene as fast as inference allows, so the
# gate unblocks the moment the operator finishes placing objects.
gate_vlm_check_period_s: 0.0

# Force re-download of policy checkpoints on every server startup.
# Set to false only if you're offline and want to use cached models.
force_download_policy: true

# Deterministic spatial-prior out-of-distribution (OOD) gate.
# This is independent of and complementary to the VLM gate: it checks whether
# the object is located where the policy was trained to handle it, using a
# Gaussian prior fitted offline from the training demonstrations.
#
# mode:
#   off     -> gate fully inert (no effect on the BT).
#   shadow  -> gate evaluates and logs the verdict but NEVER blocks. Use this
#              first on the real robot to measure the observed-vs-prior distance
#              and calibrate the offset/threshold before enforcing.
#   enforce -> a FAIL (object OOD) blocks the skill; ABSTAIN never blocks.
#
# NOTE: Until calibrated hand-eye transforms are supplied (camera_static_tf_map
# is empty above), the perception node returns camera-frame poses and the gate
# will ABSTAIN with reason "frame_mismatch". Shadow mode makes this visible.
spatial_prior_gate:
  mode: shadow
  priors_dir: spatial_priors
  query_pose_service: "/perception/query_pose"
  query_max_age_s: 2.0
  require_fresh_pose: true
  query_timeout_s: 2.0
  skill_priors:
    pick_and_insert_capsule: "put_coffee.json"
  skill_objects:
    pick_and_insert_capsule: "coffee_capsule"

skills:
  - name: pick_and_insert_capsule
    dataset_repo_id: "scene-transition/pick_and_insert_capsule"
    metadata_source: robot
    task: "There is no coffee capsule in the scene."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "HSP-IIT/act_put_coffee"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 30.0
    settle_time_s: 0.0

  - name: close_coffee_machine
    dataset_repo_id: "Squitieri/act_close_machine"
    metadata_source: robot
    task: "Verify that the coffee machine lid is fully closed ."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "Squitieri/act_close_machine"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 15.0
    settle_time_s: 0.0
