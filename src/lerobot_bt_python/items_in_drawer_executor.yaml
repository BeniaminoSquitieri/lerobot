# @file items_in_drawer_executor.yaml
# @brief Real robot skill-server config for the items_in_drawer task.
#
# Consumed by lerobot_bt_python.server before robot execution starts. It defines
# the BT service names, verification timeout, required cameras, processor stack,
# and learned skills used by this task's Python executor. Human drawer
# open/close phases stay in the BT as verification gates. Do not change service
# names, policy paths, or timing values casually before robot-day.

vlm_timeout_s: 60.0

expected_skill_names:
  - insert_next_drawer_item

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: true
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: true
      width: 640
      height: 480
      fps: 30

camera_publish_map:
  wrist: "/panda/camera/wrist/image_compressed"
  left: "/panda/camera/front/image_compressed"
camera_depth_publish_map:
  wrist: "/panda/camera/wrist/depth"
  left: "/panda/camera/front/depth"
camera_info_publish_map:
  wrist: "/panda/camera/wrist/camera_info"
  left: "/panda/camera/front/camera_info"
camera_frame_id_map:
  wrist: "panda_wrist_camera"
  left: "panda_front_camera"
# Add calibrated hand-eye transforms in camera_static_tf_map before using
# object poses for grasping. Without real base_link->camera calibration, the
# perception node marks poses tf_unavailable and rejects robot-frame queries.

skills:
  - name: insert_next_drawer_item
    dataset_repo_id: "scene-transition/insert_next_drawer_item"
    metadata_source: robot
    task: "Pick the next object and place it inside the open drawer without blocking the rails."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "TODO_ACT_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0
