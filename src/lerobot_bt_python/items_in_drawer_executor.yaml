# @file items_in_drawer_executor.yaml
# @brief Real-robot Python execution config for items_in_drawer.xml.
#
# The executor only needs the repeated insertion skill; human drawer open/close
# steps are VLM gates in the BT. Each skill can choose its own policy_variant.
# The top-level policy_variant is only the default for skills that do not
# override it.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act.
policy_variant: act

expected_skill_names:
  - insert_next_drawer_item

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

camera_publish_map:
  wrist: "/panda/camera/front/image_compressed"
  left: "/panda/camera/wrist/image_compressed"
camera_publish_fps: 10.0
camera_publish_jpeg_quality: 80

skills:
  - name: insert_next_drawer_item
    dataset_repo_id: "scene-transition/insert_next_drawer_item"
    metadata_source: robot
    task: "Pick the next object and place it inside the open drawer without blocking the rails."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "TODO_ACT_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0
