# @file items_in_drawer_executor.yaml
# @brief Real-robot Python execution config for items_in_drawer.xml.
#
# The executor only needs the repeated insertion skill; human drawer open/close
# steps are VLM gates in the BT. Each skill can choose its own policy_variant.
# The top-level policy_variant is only the default for skills that do not
# override it.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act, smolvla, diffusion, groot, xvla, pi0, vqbet, tdmpc.
policy_variant: act

expected_skill_names:
  - insert_next_drawer_item

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: insert_next_drawer_item
    dataset_repo_id: "scene-transition/insert_next_drawer_item"
    metadata_source: robot
    task: "Pick the next object and place it inside the open drawer without blocking the rails."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "TODO_ACT_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 16
        chunk_size: 16
      smolvla:
        type: smolvla
        device: cuda
        pretrained_path: "TODO_SMOLVLA_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 50
        chunk_size: 50
        num_steps: 10
      diffusion:
        type: diffusion
        device: cuda
        pretrained_path: "TODO_DIFFUSION_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 8
        horizon: 16
      multi_task_dit:
        type: multi_task_dit
        device: cuda
        pretrained_path: "TODO_MULTI_TASK_DIT_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 24
        horizon: 32
      vqbet:
        type: vqbet
        device: cuda
        pretrained_path: "TODO_VQBET_INSERT_NEXT_DRAWER_ITEM"
        n_obs_steps: 5
        n_action_pred_token: 3
        action_chunk_size: 5
      pi0:
        type: pi0
        device: cuda
        pretrained_path: "TODO_PI0_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 50
        chunk_size: 50
      pi0_fast:
        type: pi0_fast
        device: cuda
        pretrained_path: "TODO_PI0_FAST_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 50
        chunk_size: 50
      pi05:
        type: pi05
        device: cuda
        pretrained_path: "TODO_PI05_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 50
        chunk_size: 50
      groot:
        type: groot
        device: cuda
        pretrained_path: "TODO_GROOT_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 50
        chunk_size: 50
      xvla:
        type: xvla
        device: cuda
        pretrained_path: "TODO_XVLA_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 32
        chunk_size: 32
      wall_x:
        type: wall_x
        device: cuda
        pretrained_path: "TODO_WALL_X_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 32
        chunk_size: 32
      tdmpc:
        type: tdmpc
        device: cuda
        pretrained_path: "TODO_TDMPC_INSERT_NEXT_DRAWER_ITEM"
        n_action_steps: 1
        horizon: 5
        n_action_repeats: 2
      sac:
        type: sac
        device: cuda
        pretrained_path: "TODO_SAC_INSERT_NEXT_DRAWER_ITEM"
      reward_classifier:
        type: reward_classifier
        device: cuda
        pretrained_path: "TODO_REWARD_CLASSIFIER_INSERT_NEXT_DRAWER_ITEM"
      sarm:
        type: sarm
        device: cuda
        pretrained_path: "TODO_SARM_INSERT_NEXT_DRAWER_ITEM"
    transition:
      mode: timeout
      max_duration_s: 60.0
    settle_time_s: 0.0
