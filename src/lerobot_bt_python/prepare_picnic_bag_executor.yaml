# @file prepare_picnic_bag_executor.yaml
# @brief Real-robot Python execution config for prepare_picnic_bag.xml.
#
# To connect the real BC model, replace only the policy.pretrained_path value
# below. The human-driven bag open/close phases are VLM gates in the BT.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

expected_skill_names:
  - bag_next_picnic_item

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: bag_next_picnic_item
    dataset_repo_id: "scene-transition/bag_next_picnic_item"
    metadata_source: robot
    task: "Pick the next picnic item from the table and place it inside the open bag while the human keeps the bag open."
    policy:
      type: act
      device: cuda
      pretrained_path: "TODO_MODEL_BAG_NEXT_PICNIC_ITEM"
      n_action_steps: 16
      chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0
