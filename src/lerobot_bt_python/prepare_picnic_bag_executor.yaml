      groot:
        type: groot
        device: cuda
        pretrained_path: "TODO_GROOT_BAG_PEAR"
        n_action_steps: 50
        chunk_size: 50
      xvla:
        type: xvla
        device: cuda
        pretrained_path: "TODO_XVLA_BAG_PEAR"
        n_action_steps: 32
        chunk_size: 32
      wall_x:
        type: wall_x
        device: cuda
        pretrained_path: "TODO_WALL_X_BAG_PEAR"
        n_action_steps: 32
