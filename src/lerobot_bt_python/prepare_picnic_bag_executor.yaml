# @file prepare_picnic_bag_executor.yaml
# @brief Real-robot Python execution config for prepare_picnic_bag.xml.
#
# Human-driven item insertion phases are VLM gates in the BT. Each robot skill
# can choose its own policy_variant. The top-level policy_variant is only the
# default for skills that do not override it.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
vlm_timeout_s: 0.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act, smolvla, diffusion, groot, xvla, pi0, vqbet, tdmpc.
policy_variant: smolvla

expected_skill_names:
  - bag_bread
  - bag_pear

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

skills:
  - name: bag_bread
    dataset_repo_id: "scene-transition/bag_bread"
    metadata_source: robot
    task: "Pick the bread from the table and place it inside the open picnic bag."
    policy_variant: smolvla
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "TODO_ACT_BAG_BREAD"
        n_action_steps: 16
        chunk_size: 16
      smolvla:
        type: smolvla
        device: cuda
        pretrained_path: "Squitieri/picnic_bread_smolvla_10k"
        n_action_steps: 50
        chunk_size: 50
        num_steps: 10
      diffusion:
        type: diffusion
        device: cuda
        pretrained_path: "TODO_DIFFUSION_BAG_BREAD"
        n_action_steps: 8
        horizon: 16
      multi_task_dit:
        type: multi_task_dit
        device: cuda
        pretrained_path: "TODO_MULTI_TASK_DIT_BAG_BREAD"
        n_action_steps: 24
        horizon: 32
      vqbet:
        type: vqbet
        device: cuda
        pretrained_path: "TODO_VQBET_BAG_BREAD"
        n_obs_steps: 5
        n_action_pred_token: 3
        action_chunk_size: 5
      pi0:
        type: pi0
        device: cuda
        pretrained_path: "TODO_PI0_BAG_BREAD"
        n_action_steps: 50
        chunk_size: 50
      pi0_fast:
        type: pi0_fast
        device: cuda
        pretrained_path: "TODO_PI0_FAST_BAG_BREAD"
        n_action_steps: 50
        chunk_size: 50
      pi05:
        type: pi05
        device: cuda
        pretrained_path: "TODO_PI05_BAG_BREAD"
        n_action_steps: 50
        chunk_size: 50
      groot:
        type: groot
        device: cuda
        pretrained_path: "TODO_GROOT_BAG_BREAD"
        n_action_steps: 50
        chunk_size: 50
      xvla:
        type: xvla
        device: cuda
        pretrained_path: "TODO_XVLA_BAG_BREAD"
        n_action_steps: 32
        chunk_size: 32
      wall_x:
        type: wall_x
        device: cuda
        pretrained_path: "TODO_WALL_X_BAG_BREAD"
        n_action_steps: 32
        chunk_size: 32
      tdmpc:
        type: tdmpc
        device: cuda
        pretrained_path: "TODO_TDMPC_BAG_BREAD"
        n_action_steps: 1
        horizon: 5
        n_action_repeats: 2
      sac:
        type: sac
        device: cuda
        pretrained_path: "TODO_SAC_BAG_BREAD"
      reward_classifier:
        type: reward_classifier
        device: cuda
        pretrained_path: "TODO_REWARD_CLASSIFIER_BAG_BREAD"
      sarm:
        type: sarm
        device: cuda
        pretrained_path: "TODO_SARM_BAG_BREAD"
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: bag_pear
    dataset_repo_id: "scene-transition/bag_pear"
    metadata_source: robot
    task: "Pick the pear from the table and place it inside the open picnic bag."
    policy_variant: smolvla
