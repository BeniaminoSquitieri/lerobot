        pretrained_path: "TODO_PI0_BAG_PEAR"
        n_action_steps: 50
        chunk_size: 50
      pi0_fast:
        type: pi0_fast
        device: cuda
        pretrained_path: "TODO_PI0_FAST_BAG_PEAR"
        n_action_steps: 50
