# @file prepare_picnic_bag_executor.yaml
# @brief Real-robot Python execution config for prepare_picnic_bag.xml.
#
# Human-driven item insertion phases are VLM gates in the BT. Each robot skill
# can choose its own policy_variant. The top-level policy_variant is only the
# default for skills that do not override it.

bt_command_service: "/lerobot_bt/run"
vlm_state_service: "/lerobot_bt/vlm_state"
legacy_vlm_result_service: "/lerobot_bt/vlm_result_legacy"
vlm_request_topic: "/lerobot_bt/vlm_request"
vlm_result_topic: "/lerobot_bt/vlm_result"
# 0 disables the per-attempt VLM check timeout (gate waits indefinitely for SUCCESS).
vlm_timeout_s: 0.0

# Default variant. Per-skill policy_variant can mix any registered LeRobot
# policy type, e.g. act.
policy_variant: act

expected_skill_names:
  - bag_bread
  - bag_pear

required_cameras:
  - wrist
  - left

robot:
  arm:
    type: panda
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: true
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: true
      width: 640
      height: 480
      fps: 30

fps: 10
display_data: true
play_sounds: true
reset_robot_on_startup: true
reset_robot_before_skill: true
rename_map: {}

robot_action_processor:
  steps: []
robot_observation_processor:
  steps: []

camera_publish_map:
  wrist: "/panda/camera/wrist/image_compressed"
  left: "/panda/camera/front/image_compressed"
camera_depth_publish_map:
  wrist: "/panda/camera/wrist/depth"
  left: "/panda/camera/front/depth"
camera_info_publish_map:
  wrist: "/panda/camera/wrist/camera_info"
  left: "/panda/camera/front/camera_info"
camera_frame_id_map:
  wrist: "panda_wrist_camera"
  left: "panda_front_camera"
# Add calibrated hand-eye transforms in camera_static_tf_map before using
# object poses for grasping. Without real base_link->camera calibration, the
# perception node marks poses tf_unavailable and rejects robot-frame queries.
camera_publish_fps: 10.0
camera_publish_jpeg_quality: 80

skills:
  - name: bag_bread
    dataset_repo_id: "scene-transition/bag_bread"
    metadata_source: robot
    task: "Pick the bread from the table and place it inside the open picnic bag."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "TODO_ACT_BAG_BREAD"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0

  - name: bag_pear
    dataset_repo_id: "scene-transition/bag_pear"
    metadata_source: robot
    task: "Pick the pear from the table and place it inside the open picnic bag."
    policy_variant: act
    policy_variants:
      act:
        type: act
        device: cuda
        pretrained_path: "TODO_ACT_BAG_PEAR"
        n_action_steps: 16
        chunk_size: 16
    transition:
      mode: timeout
      max_duration_s: 120.0
    settle_time_s: 0.0
