<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 16px; fill: #475569; }
      .lane  { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4 6; }
      .head  { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .hbox  { rx: 10; }
      .bt    { fill: #1d4ed8; }
      .py    { fill: #b45309; }
      .vlm   { fill: #b91c1c; }
      .msg   { font-family: 'Consolas', monospace; font-size: 14px; fill: #0f172a; }
      .step  { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .stepCircle { fill: #0f172a; }
      .note  { font-size: 13px; fill: #475569; font-style: italic; }
      .ok    { fill: #15803d; font-weight: 700; }
      .fail  { fill: #b91c1c; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="750" y="50" text-anchor="middle" class="title">Sequenza VLM ↔ BT — flusso standard di un gate / skill</text>
  <text x="750" y="78" text-anchor="middle" class="sub">Ogni freccia è un messaggio ROS 2 (JSON su std_msgs/String). Cerchi neri = ordine temporale.</text>

  <!-- Lane headers -->
  <rect x="160" y="110" width="260" height="50" class="hbox bt"/>
  <text x="290" y="143" class="head">BT runner (C++)</text>
  <rect x="620" y="110" width="260" height="50" class="hbox py"/>
  <text x="750" y="143" class="head">Python skill server</text>
  <rect x="1080" y="110" width="260" height="50" class="hbox vlm"/>
  <text x="1210" y="143" class="head">VLM node (GPU)</text>

  <!-- Lifelines -->
  <line x1="290"  y1="160" x2="290"  y2="900" class="lane"/>
  <line x1="750"  y1="160" x2="750"  y2="900" class="lane"/>
  <line x1="1210" y1="160" x2="1210" y2="900" class="lane"/>

  <!-- Step 1: BT tick -> OpenVLMGate -->
  <circle cx="290" cy="200" r="14" class="stepCircle"/>
  <text x="290" y="205" class="step">1</text>
  <rect x="40" y="220" width="500" height="48" class="panel"/>
  <text x="60" y="240" class="msg">BT tick: OpenVLMGate(gate_name="scene_1_ready")</text>
  <text x="60" y="258" class="note">Il BT chiede al Python di aprire un attempt di verifica VLM.</text>

  <!-- Step 2: Python -> VLM request -->
  <circle cx="750" cy="305" r="14" class="stepCircle"/>
  <text x="750" y="310" class="step">2</text>
  <line x1="750" y1="320" x2="1200" y2="320" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="975" y="312" text-anchor="middle" class="msg" fill="#1d4ed8">publish /lerobot_bt/vlm_request</text>
  <rect x="780" y="330" width="430" height="62" class="panel"/>
  <text x="795" y="350" class="msg">{ "skill_name":"scene_1_ready",</text>
  <text x="795" y="368" class="msg">  "attempt_id": 42,</text>
  <text x="795" y="386" class="msg">  "task":"Pick the toast upon the table." }</text>

  <!-- Step 3: VLM RUNNING -->
  <circle cx="1210" cy="430" r="14" class="stepCircle"/>
  <text x="1210" y="435" class="step">3</text>
  <line x1="1210" y1="450" x2="760" y2="450" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="985" y="442" text-anchor="middle" class="msg">publish /lerobot_bt/vlm_result · status=RUNNING</text>
  <text x="985" y="468" text-anchor="middle" class="note">"sto guardando la scena, non sono pronto a decidere"</text>

  <!-- Step 4: VLM verdict (SUCCESS branch) -->
  <circle cx="1210" cy="520" r="14" class="stepCircle"/>
  <text x="1210" y="525" class="step">4</text>
  <line x1="1210" y1="540" x2="760" y2="540" stroke="#15803d" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="985" y="532" text-anchor="middle" class="msg ok">publish /lerobot_bt/vlm_result · status=SUCCESS</text>
  <rect x="780" y="552" width="430" height="62" class="panel"/>
  <text x="795" y="572" class="msg">{ "skill_name":"scene_1_ready",</text>
  <text x="795" y="590" class="msg">  "attempt_id": 42,  "status":"SUCCESS",</text>
  <text x="795" y="608" class="msg">  "message":"toast visible on table" }</text>

  <!-- Step 5: Python -> BT, BT advances -->
  <circle cx="290" cy="650" r="14" class="stepCircle"/>
  <text x="290" y="655" class="step">5</text>
  <line x1="740" y1="660" x2="300" y2="660" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="520" y="652" text-anchor="middle" class="msg">WaitForVLMVerdict → SUCCESS</text>
  <text x="520" y="678" text-anchor="middle" class="note">Il BT avanza al nodo successivo (es. RunRobotSkill).</text>

  <!-- Separator -->
  <line x1="40" y1="720" x2="1460" y2="720" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="745" class="msg" fill="#b91c1c">Ramo alternativo — verdetto FAILURE</text>

  <!-- Step 4b: FAILURE -->
  <circle cx="1210" cy="780" r="14" class="stepCircle"/>
  <text x="1210" y="785" class="step">4'</text>
  <line x1="1210" y1="800" x2="760" y2="800" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="985" y="792" text-anchor="middle" class="msg fail">publish /lerobot_bt/vlm_result · status=FAILURE</text>

  <!-- Step 5b: BT retry -->
  <circle cx="290" cy="850" r="14" class="stepCircle"/>
  <text x="290" y="855" class="step">5'</text>
  <line x1="740" y1="860" x2="300" y2="860" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="520" y="852" text-anchor="middle" class="msg fail">RetryUntilSuccessful → rilancia la stessa BC skill</text>
  <text x="520" y="878" text-anchor="middle" class="note">attempt_id viene incrementato; nessun recovery deterministico.</text>
</svg>
