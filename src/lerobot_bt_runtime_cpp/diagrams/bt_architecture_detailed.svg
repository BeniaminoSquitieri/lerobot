<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 36px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 18px; fill: #334155; }
      .box { stroke: #0f172a; stroke-width: 2.5; rx: 18; }
      .bt { fill: #dbeafe; }
      .py { fill: #fef3c7; }
      .bc { fill: #dcfce7; }
      .vlm { fill: #fee2e2; }
      .cfg { fill: #ede9fe; }
      .robot { fill: #e0f2fe; }
      .text { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 18px; fill: #111827; }
      .head { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .small { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 14px; fill: #334155; }
      .mono { font-family: DejaVu Sans Mono, monospace; font-size: 12.5px; fill: #0f172a; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .topic { stroke: #b45309; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrowhead-orange); }
      .service { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrowhead-blue); }
      .data { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrowhead-green); }
      .thin { stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="13" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 13 4.5, 0 9" fill="#0f172a"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="13" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 13 4.5, 0 9" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="13" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 13 4.5, 0 9" fill="#b45309"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="13" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 13 4.5, 0 9" fill="#047857"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <text class="title" x="52" y="62">Detailed BT - BC - VLM Architecture</text>
  <text class="subtitle" x="52" y="92">The BT owns ordering and retries.</text>
  <text class="subtitle" x="52" y="116">Python stores VLM state; bridge adapts Panda protocol.</text>

  <rect class="box cfg" x="55" y="145" width="285" height="245"/>
  <text class="head" x="82" y="184">Task Definition</text>
  <text class="mono" x="82" y="222">BT XML tree</text>
  <text class="small" x="82" y="250">Sequence, RetryUntilSuccessful,</text>
  <text class="small" x="82" y="274">AwaitScene, DoSkill</text>
  <text class="mono" x="82" y="314">BT YAML profile</text>
  <text class="small" x="82" y="342">gate names, skill names,</text>
  <text class="small" x="82" y="366">timeouts, retry limits</text>

  <rect class="box bt" x="420" y="130" width="365" height="330"/>
  <text class="head" x="450" y="169">C++ BT Runner</text>
  <text class="mono" x="450" y="205">node: lerobot_bt_runner</text>
  <text class="small" x="450" y="238">1. loads XML tree</text>
  <text class="small" x="450" y="264">2. writes bt.* params to blackboard</text>
  <text class="small" x="450" y="290">3. ticks BehaviorTree.CPP</text>
  <text class="small" x="450" y="316">4. maps replies to BT states:</text>
  <text class="small" x="468" y="336">RUNNING, SUCCESS, FAILURE</text>
  <rect class="box" x="450" y="355" width="140" height="68" fill="#eff6ff"/>
  <text class="mono" x="468" y="384">AwaitScene</text>
  <text class="small" x="466" y="408">gate + verify</text>
  <rect class="box" x="615" y="355" width="140" height="68" fill="#eff6ff"/>
  <text class="mono" x="644" y="384">DoSkill</text>
  <text class="small" x="632" y="408">skill + verify</text>

  <rect class="box py" x="900" y="120" width="385" height="365"/>
  <text class="head" x="930" y="159">Python Skill Server</text>
  <text class="mono" x="930" y="195">node: lerobot_bt_skill_server</text>
  <text class="small" x="930" y="228">Command boundary and VLM state owner</text>
  <text class="mono" x="930" y="266">/lerobot_bt/run</text>
  <text class="small" x="930" y="291">RunNamedCommand service</text>
  <text class="mono" x="930" y="326">/lerobot_bt/vlm_state</text>
  <text class="small" x="930" y="351">GetSkillVerification service</text>
  <text class="mono" x="930" y="386">VlmCheckRegistry</text>
  <text class="small" x="930" y="411">PENDING, RUNNING, SUCCESS, FAILURE</text>
  <text class="small" x="930" y="437">timeout converts waiting checks</text>
  <text class="small" x="930" y="459">to FAILURE</text>

  <rect class="box bc" x="900" y="585" width="385" height="265"/>
  <text class="head" x="930" y="624">BC Skill Execution</text>
  <text class="mono" x="930" y="660">SkillCommandExecutor</text>
  <text class="small" x="930" y="690">lazy-loads policy runtime</text>
  <text class="small" x="930" y="716">runs one learned primitive</text>
  <text class="small" x="930" y="742">uses action/observation processors</text>
  <text class="mono" x="930" y="782">Robot</text>
  <text class="small" x="930" y="809">observations -> policy -> actions</text>

  <rect class="box vlm" x="1360" y="120" width="200" height="365"/>
  <text class="head" x="1384" y="159">Panda VLM</text>
  <text class="mono" x="1384" y="195">/panda/vlm/request</text>
  <text class="small" x="1384" y="220">plain task text</text>
  <text class="mono" x="1384" y="258">Qwen3-VL</text>
  <text class="small" x="1384" y="284">front + wrist</text>
  <text class="small" x="1384" y="309">camera scene</text>
  <text class="mono" x="1384" y="347">/panda/vlm/status</text>
  <text class="small" x="1384" y="372">SUCCESS</text>
  <text class="small" x="1384" y="396">FAILED</text>
  <text class="small" x="1384" y="420">STILL_RUNNING</text>

  <rect class="box robot" x="1360" y="585" width="200" height="265"/>
  <text class="head" x="1396" y="624">Cameras</text>
  <text class="mono" x="1384" y="662">front image</text>
  <text class="mono" x="1384" y="694">wrist image</text>
  <text class="small" x="1384" y="730">compressed ROS</text>
  <text class="small" x="1384" y="754">image streams</text>
  <text class="small" x="1384" y="782">decoded + composed</text>
  <text class="small" x="1384" y="806">inside VLM node</text>

  <rect class="box" x="1338" y="505" width="245" height="58" fill="#fff7ed"/>
  <text class="mono" x="1355" y="541">lerobot-bt-vlm-bridge</text>

  <path class="arrow" d="M340 260 C370 260 385 260 420 260"/>
  <text class="mono" x="354" y="244">XML/YAML</text>

  <path class="service" d="M785 230 C840 230 845 230 900 230"/>
  <text class="mono" x="798" y="214">service: /lerobot_bt/run</text>
  <text class="small" x="798" y="246">kind, name, timeout_s</text>

  <path class="service" d="M900 315 C845 315 840 315 785 315"/>
  <text class="mono" x="796" y="300">service: /lerobot_bt/vlm_state</text>
  <text class="small" x="801" y="332">has_attempt, status, message</text>

  <path class="data" d="M1090 485 C1090 535 1090 545 1090 585"/>
  <text class="mono" x="1110" y="540">execute_skill()</text>

  <path class="topic" d="M1285 395 C1320 395 1328 522 1345 522"/>
  <text class="mono" x="1244" y="376">topic:</text>
  <text class="mono" x="1244" y="395">/lerobot_bt/vlm_request</text>
  <text class="small" x="1250" y="409">skill_name, attempt_id</text>

  <path class="topic" d="M1460 505 C1460 492 1460 492 1460 485"/>
  <text class="mono" x="1302" y="500">/panda/vlm/request</text>

  <path class="topic" d="M1460 485 C1460 500 1460 500 1460 505"/>
  <text class="mono" x="1472" y="500">/panda/vlm/status</text>

  <path class="topic" d="M1345 545 C1315 545 1305 438 1285 438"/>
  <text class="mono" x="1190" y="529">topic:</text>
  <text class="mono" x="1190" y="548">/lerobot_bt/vlm_result</text>
  <text class="small" x="1196" y="562">JSON verdict for registry</text>

  <path class="data" d="M1370 710 C1335 710 1330 309 1370 309"/>
  <text class="mono" x="1272" y="682">camera frames</text>

  <rect class="box" x="55" y="785" width="620" height="120" fill="#ffffff"/>
  <text class="head" x="82" y="825">Legend</text>
  <line class="service thin" x1="82" y1="858" x2="160" y2="858"/>
  <text class="small" x="178" y="864">ROS2 service call, request/response</text>
  <line class="topic thin" x1="82" y1="888" x2="160" y2="888"/>
  <text class="small" x="178" y="894">ROS2 topic, asynchronous stream</text>
  <line class="data thin" x1="405" y1="858" x2="483" y2="858"/>
  <text class="small" x="501" y="864">internal Python call</text>
  <text class="small" x="501" y="891">or robot data flow</text>
</svg>
