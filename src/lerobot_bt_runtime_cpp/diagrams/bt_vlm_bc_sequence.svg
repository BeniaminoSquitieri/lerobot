<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .lane { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .bt { fill: #e0f2fe; }
      .py { fill: #fef3c7; }
      .bc { fill: #dcfce7; }
      .vlm { fill: #fee2e2; }
      .cam { fill: #ede9fe; }
      .text { font-family: "Verdana", "DejaVu Sans", sans-serif; fill: #0f172a; font-size: 22px; }
      .title { font-size: 34px; font-weight: 700; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 15px; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
      .note { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 10; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="text title" x="46" y="58">Comunicazione BT - BC - VLM</text>
  <text class="text small" x="46" y="90">Sequenza minima per un gate o una skill: il BT orchestra, Python esegue, il VLM verifica.</text>

  <rect class="lane bt" x="55" y="130" width="220" height="500"/>
  <rect class="lane py" x="335" y="130" width="250" height="500"/>
  <rect class="lane bc" x="645" y="130" width="215" height="500"/>
  <rect class="lane vlm" x="920" y="130" width="245" height="500"/>
  <rect class="lane cam" x="1010" y="505" width="175" height="95"/>

  <text class="text" x="108" y="170">BT Runner</text>
  <text class="text" x="373" y="170">Python Server</text>
  <text class="text" x="691" y="170">BC Skill</text>
  <text class="text" x="964" y="170">Panda VLM</text>
  <text class="text small" x="1040" y="544">Cameras</text>

  <path class="arrow" d="M275 220 L335 220"/>
  <text class="text mono" x="82" y="210">/lerobot_bt/run</text>
  <text class="text tiny" x="82" y="236">kind=skill or vlm_gate_pending</text>

  <path class="arrow" d="M585 285 L645 285"/>
  <text class="text mono" x="370" y="275">execute_skill(name)</text>
  <text class="text tiny" x="370" y="301">only for kind=skill</text>

  <path class="arrow dashed" d="M645 342 L585 342"/>
  <text class="text mono" x="668" y="333">CommandResult</text>
  <text class="text tiny" x="668" y="359">success/status/message</text>

  <path class="arrow" d="M460 390 L460 440"/>
  <text class="text mono" x="374" y="382">begin_attempt()</text>
  <text class="text tiny" x="374" y="461">status=PENDING</text>

  <path class="arrow" d="M585 480 L920 480"/>
  <text class="text mono" x="604" y="470">/lerobot_bt/vlm_request JSON</text>
  <text class="text tiny" x="604" y="496">skill_name + attempt_id</text>

  <path class="arrow" d="M920 520 L840 520 L840 600 L920 600"/>
  <text class="text mono" x="930" y="500">bridge publishes</text>
  <text class="text mono" x="930" y="526">/panda/vlm/request</text>

  <path class="arrow dashed" d="M1085 505 L1050 410"/>
  <text class="text mono" x="982" y="398">front/wrist images</text>

  <path class="arrow dashed" d="M920 430 L585 430"/>
  <text class="text mono" x="604" y="420">/lerobot_bt/vlm_result JSON</text>
  <text class="text tiny" x="604" y="446">SUCCESS or FAILURE or waiting</text>

  <path class="arrow dashed" d="M335 555 L275 555"/>
  <text class="text mono" x="86" y="545">/lerobot_bt/vlm_state</text>
  <text class="text tiny" x="86" y="571">BT polls latest verdict</text>

  <rect class="note" x="330" y="650" width="620" height="42"/>
  <text class="text tiny" x="352" y="677">Mismatch da correggere: Panda VLM emette STILL_RUNNING/FAILED, mentre il BT accetta RUNNING/FAILURE.</text>
</svg>
