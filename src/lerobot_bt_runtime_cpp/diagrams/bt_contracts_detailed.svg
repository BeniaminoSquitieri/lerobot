<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f9fafb; }
      .title { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 17px; fill: #334155; }
      .box { stroke: #111827; stroke-width: 2.3; rx: 16; }
      .srv { fill: #dbeafe; }
      .topic { fill: #ffedd5; }
      .state { fill: #dcfce7; }
      .panda { fill: #fee2e2; }
      .head { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .mono { font-family: DejaVu Sans Mono, monospace; font-size: 12.5px; fill: #0f172a; }
      .small { font-family: Verdana, DejaVu Sans, sans-serif; font-size: 13.5px; fill: #334155; }
      .arrow { stroke: #0f172a; stroke-width: 2.7; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="52" y="62">Detailed ROS2 Contracts and Payloads</text>
  <text class="subtitle" x="52" y="92">Every boundary is explicit: services, topics, and strings.</text>
  <text class="subtitle" x="52" y="116">The Panda VLM stays behind the bridge.</text>

  <rect class="box srv" x="70" y="140" width="430" height="290"/>
  <text class="head" x="100" y="178">RunNamedCommand.srv</text>
  <text class="mono" x="100" y="214">service: /lerobot_bt/run</text>
  <text class="small" x="100" y="244">Request from C++ BT to Python:</text>
  <text class="mono" x="120" y="274">string kind</text>
  <text class="mono" x="120" y="302">string name</text>
  <text class="mono" x="120" y="330">float32 timeout_s</text>
  <text class="small" x="100" y="360">Response to BT:</text>
  <text class="mono" x="120" y="384">bool success</text>
  <text class="mono" x="120" y="410">string status, string message</text>

  <rect class="box srv" x="585" y="140" width="430" height="290"/>
  <text class="head" x="615" y="178">GetSkillVerification.srv</text>
  <text class="mono" x="615" y="214">service: /lerobot_bt/vlm_state</text>
  <text class="small" x="615" y="244">Request from C++ BT polling loop:</text>
  <text class="mono" x="635" y="274">string skill_name</text>
  <text class="small" x="615" y="314">Response from Python registry:</text>
  <text class="mono" x="635" y="344">bool has_attempt</text>
  <text class="mono" x="635" y="372">int32 attempt_id</text>
  <text class="mono" x="635" y="398">string status, string message</text>

  <rect class="box srv" x="1100" y="140" width="430" height="290"/>
  <text class="head" x="1130" y="178">ReportSkillVerification.srv</text>
  <text class="mono" x="1130" y="214">legacy service</text>
  <text class="small" x="1130" y="244">Kept for compatibility.</text>
  <text class="small" x="1130" y="270">New verifiers should publish topic JSON.</text>
  <text class="mono" x="1130" y="314">skill_name, attempt_id</text>
  <text class="mono" x="1130" y="342">status, message</text>

  <rect class="box topic" x="70" y="485" width="430" height="325"/>
  <text class="head" x="100" y="523">/lerobot_bt/vlm_request</text>
  <text class="small" x="100" y="555">Published by Python server</text>
  <text class="small" x="100" y="576">when a check is opened.</text>
  <text class="mono" x="100" y="592">{</text>
  <text class="mono" x="122" y="620">"event": "vlm_check_requested",</text>
  <text class="mono" x="122" y="648">"skill_name": "...",</text>
  <text class="mono" x="122" y="676">"attempt_id": 1,</text>
  <text class="mono" x="122" y="704">"status": "PENDING",</text>
  <text class="mono" x="122" y="732">"allowed_statuses": [...],</text>
  <text class="mono" x="122" y="760">"allowed_next_actions": [...]</text>
  <text class="mono" x="100" y="788">}</text>

  <rect class="box panda" x="585" y="485" width="430" height="325"/>
  <text class="head" x="615" y="523">Panda VLM Protocol</text>
  <text class="small" x="615" y="555">Plain string protocol used</text>
  <text class="small" x="615" y="576">by the live verifier.</text>
  <text class="mono" x="615" y="596">/panda/vlm/request</text>
  <text class="small" x="635" y="626">single text prompt</text>
  <text class="small" x="635" y="647">generated by bridge</text>
  <text class="mono" x="615" y="672">/panda/vlm/status</text>
  <text class="small" x="635" y="702">SUCCESS</text>
  <text class="small" x="635" y="730">FAILED</text>
  <text class="small" x="635" y="758">STILL_RUNNING</text>

  <rect class="box topic" x="1100" y="485" width="430" height="325"/>
  <text class="head" x="1130" y="523">/lerobot_bt/vlm_result</text>
  <text class="small" x="1130" y="555">Published by manual verifier</text>
  <text class="small" x="1130" y="576">or by the bridge.</text>
  <text class="mono" x="1130" y="592">{</text>
  <text class="mono" x="1152" y="620">"skill_name": "...",</text>
  <text class="mono" x="1152" y="648">"attempt_id": 1,</text>
  <text class="mono" x="1152" y="676">"status": "SUCCESS",</text>
  <text class="mono" x="1152" y="704">"message": "...",</text>
  <text class="mono" x="1152" y="732">"failure_reason": optional,</text>
  <text class="mono" x="1152" y="760">"next_action": optional</text>
  <text class="mono" x="1130" y="788">}</text>

  <rect class="box state" x="320" y="870" width="960" height="105"/>
  <text class="head" x="350" y="907">Status Semantics</text>
  <text class="mono" x="350" y="935">SUCCESS: advance BT</text>
  <text class="mono" x="350" y="958">FAILURE: fail leaf and retry if XML allows</text>
  <text class="mono" x="785" y="958">PENDING / RUNNING / WAIT_HUMAN: keep polling</text>

  <path class="arrow dash" d="M500 650 L585 650"/>
  <text class="mono" x="510" y="632">bridge reads</text>
  <path class="arrow dash" d="M1015 650 L1100 650"/>
  <text class="mono" x="1025" y="632">bridge writes</text>

  <path class="arrow" d="M800 810 L800 870"/>
  <text class="mono" x="820" y="846">status mapping</text>
  <text class="small" x="950" y="838">FAILED -> FAILURE</text>
  <text class="small" x="950" y="860">STILL_RUNNING -> RUNNING</text>
</svg>
