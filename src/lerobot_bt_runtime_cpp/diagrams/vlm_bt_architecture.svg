<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <style>
      .title    { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #475569; }
      .machine  { fill: none; stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 6; rx: 18; }
      .machine-label { font-size: 18px; font-weight: 700; fill: #334155; }
      .box      { stroke: #0f172a; stroke-width: 2; rx: 12; }
      .bt       { fill: #dbeafe; }
      .py       { fill: #fef3c7; }
      .vlm      { fill: #fee2e2; }
      .cam      { fill: #ede9fe; }
      .robot    { fill: #dcfce7; }
      .boxTitle { font-size: 18px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .boxSub   { font-size: 13px; fill: #334155; text-anchor: middle; }
      .topic    { font-family: 'Consolas', monospace; font-size: 14px; font-weight: 600; fill: #1d4ed8; }
      .topicGreen { font-family: 'Consolas', monospace; font-size: 14px; font-weight: 600; fill: #15803d; }
      .note     { font-size: 13px; fill: #475569; font-style: italic; }
      .legend   { font-size: 14px; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>

  <text x="700" y="50" text-anchor="middle" class="title">Comunicazione VLM ↔ Behavior Tree</text>
  <text x="700" y="78" text-anchor="middle" class="subtitle">Architettura multi-macchina basata su ROS 2 (topic JSON su std_msgs/String)</text>

  <!-- LEFT MACHINE: Robot -->
  <rect x="40" y="120" width="560" height="620" class="machine"/>
  <text x="320" y="150" text-anchor="middle" class="machine-label">MACCHINA ROBOT — IITICB001DW001</text>

  <!-- BT runner -->
  <rect x="80" y="180" width="480" height="120" class="box bt"/>
  <text x="320" y="212" class="boxTitle">Behavior Tree runner (C++)</text>
  <text x="320" y="236" class="boxSub">lerobot_bt_runner  •  BehaviorTree.CPP</text>
  <text x="320" y="258" class="boxSub">Decide ordine, retry, gating</text>
  <text x="320" y="280" class="boxSub">Nodi: OpenVLMGate · WaitForVLMVerdict · RunRobotSkill</text>

  <!-- Python skill server -->
  <rect x="80" y="330" width="480" height="120" class="box py"/>
  <text x="320" y="362" class="boxTitle">Python skill server</text>
  <text x="320" y="386" class="boxSub">lerobot-bt-skill-server  •  rclpy</text>
  <text x="320" y="408" class="boxSub">Esegue una BC skill alla volta</text>
  <text x="320" y="430" class="boxSub">Apre attempt VLM e attende verdetto</text>

  <!-- Camera publisher -->
  <rect x="80" y="480" width="230" height="110" class="box cam"/>
  <text x="195" y="512" class="boxTitle">Camera publisher</text>
  <text x="195" y="534" class="boxSub">panda_camera_publisher.py</text>
  <text x="195" y="556" class="boxSub">RealSense → ROS2</text>
  <text x="195" y="576" class="boxSub">CompressedImage</text>

  <!-- Robot hardware -->
  <rect x="330" y="480" width="230" height="110" class="box robot"/>
  <text x="445" y="512" class="boxTitle">Hardware</text>
  <text x="445" y="534" class="boxSub">Panda + Robotiq</text>
  <text x="445" y="556" class="boxSub">RealSense USB</text>
  <text x="445" y="576" class="boxSub">(controllato dalla BC skill)</text>

  <!-- Internal arrow BT <-> Python -->
  <line x1="320" y1="300" x2="320" y2="330" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="335" y="320" class="note">ROS2 services (BC skill / VLM gate)</text>

  <!-- Python -> Camera/Robot -->
  <line x1="195" y1="450" x2="195" y2="480" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="450" x2="445" y2="480" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RIGHT MACHINE: GPU server -->
  <rect x="800" y="120" width="560" height="620" class="machine"/>
  <text x="1080" y="150" text-anchor="middle" class="machine-label">GPU SERVER — iitbmp014srv002</text>

  <!-- VLM node -->
  <rect x="840" y="220" width="480" height="180" class="box vlm"/>
  <text x="1080" y="256" class="boxTitle">VLM node (panda_vlm_live.py)</text>
  <text x="1080" y="282" class="boxSub">Modello Qwen3-VL  •  inferenza CUDA</text>
  <text x="1080" y="312" class="boxSub">Verifica se la scena attesa è stata raggiunta</text>
  <text x="1080" y="336" class="boxSub">Non è un planner: non sceglie cosa fare dopo</text>
  <text x="1080" y="362" class="boxSub">Emette: PENDING → RUNNING → SUCCESS / FAILURE</text>
  <text x="1080" y="386" class="boxSub">                  oppure WAIT_HUMAN / MANUAL_INTERVENTION_REQUIRED</text>

  <!-- Verifier human (optional) -->
  <rect x="840" y="430" width="480" height="90" class="box" fill="#fde68a"/>
  <text x="1080" y="462" class="boxTitle">Verifier manuale (opzionale)</text>
  <text x="1080" y="486" class="boxSub">Operatore umano che pubblica verdetti da CLI</text>
  <text x="1080" y="506" class="boxSub">Stesso topic, stesso payload JSON</text>

  <!-- TOPICS between machines -->
  <!-- vlm_request -->
  <line x1="560" y1="380" x2="840" y2="280" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="595" y="298" width="210" height="48" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="700" y="318" text-anchor="middle" class="topic">/lerobot_bt/vlm_request</text>
  <text x="700" y="336" text-anchor="middle" class="note">JSON: skill_name, attempt_id, task</text>

  <!-- vlm_result -->
  <line x1="840" y1="370" x2="560" y2="410" stroke="#15803d" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="595" y="378" width="210" height="48" fill="#ffffff" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="700" y="398" text-anchor="middle" class="topicGreen">/lerobot_bt/vlm_result</text>
  <text x="700" y="416" text-anchor="middle" class="note">JSON: status / next_action</text>

  <!-- camera topic -->
  <line x1="310" y1="535" x2="840" y2="430" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="430" y="465" width="320" height="42" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <text x="590" y="492" text-anchor="middle" class="topic" fill="#7c3aed">/panda/camera/image_raw/compressed</text>

  <!-- ROS2 dominio note -->
  <rect x="540" y="690" width="320" height="40" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" rx="8"/>
  <text x="700" y="715" text-anchor="middle" class="legend">ROS 2 (Jazzy) • RMW = CycloneDDS • Domain 0</text>

  <!-- LEGEND -->
  <g transform="translate(40,755)">
    <rect width="14" height="14" class="box bt"/>
    <text x="22" y="12" class="legend">BT (C++)</text>
    <rect x="120" width="14" height="14" class="box py"/>
    <text x="142" y="12" class="legend">Python server</text>
    <rect x="280" width="14" height="14" class="box vlm"/>
    <text x="302" y="12" class="legend">VLM</text>
    <rect x="360" width="14" height="14" class="box cam"/>
    <text x="382" y="12" class="legend">Camera</text>
    <rect x="460" width="14" height="14" class="box robot"/>
    <text x="482" y="12" class="legend">Hardware</text>
    <line x1="600" y1="7" x2="650" y2="7" stroke="#1d4ed8" stroke-width="3"/>
    <text x="660" y="12" class="legend">richiesta</text>
    <line x1="740" y1="7" x2="790" y2="7" stroke="#15803d" stroke-width="3"/>
    <text x="800" y="12" class="legend">verdetto</text>
    <line x1="880" y1="7" x2="930" y2="7" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="940" y="12" class="legend">immagini camera</text>
  </g>
</svg>
