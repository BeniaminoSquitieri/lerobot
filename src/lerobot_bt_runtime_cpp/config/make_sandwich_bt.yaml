# @file make_sandwich_bt.yaml
# @brief ROS2 parameters that configure the active LeRobot BT blackboard.
#
# Keep the BT control structure in trees/make_sandwich.xml. Put task-specific
# names and timeouts here so future BTs can reuse the same runtime with a
# different parameter profile.

lerobot_bt_runner:
  ros__parameters:
    bt:
      initial_scene_ready_gate: "initial_scene_ready"
      initial_scene_ready_max_attempts: 3
      place_first_toast_skill: "place_first_toast"
      place_first_toast_timeout_s: 120.0
      place_first_toast_max_attempts: 3
      pour_ingredient_gate: "pour_ingredient"
      pour_ingredient_max_attempts: 3
      place_second_toast_skill: "place_second_toast"
      place_second_toast_timeout_s: 30.0
      place_second_toast_max_attempts: 3
      second_toast_placed_gate: "second_toast_placed"
      second_toast_placed_max_attempts: 3
      task_complete_gate: "make_sandwich.task_complete"
      task_complete_max_attempts: 3
