# @file prepare_picnic_bag_bt.yaml
# @brief ROS2 parameters that configure prepare_picnic_bag.xml blackboard values.

lerobot_bt_runner:
  ros__parameters:
    bt:
      initial_scene_ready_gate: "prepare_picnic_bag.scene_0_ready"
      initial_scene_ready_max_attempts: 3
      human_open_bag_gate: "prepare_picnic_bag.human_open_bag"
      human_open_bag_max_attempts: 3
      human_insert_monster_gate: "prepare_picnic_bag.human_insert_monster"
      human_insert_monster_max_attempts: 3
      bag_bread_skill: "bag_bread"
      bag_bread_timeout_s: 120.0
      bag_bread_max_attempts: 3
      human_insert_mustard_gate: "prepare_picnic_bag.human_insert_mustard"
      human_insert_mustard_max_attempts: 3
      bag_pear_skill: "bag_pear"
      bag_pear_timeout_s: 120.0
      bag_pear_max_attempts: 3
