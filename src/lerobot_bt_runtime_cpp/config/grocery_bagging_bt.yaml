# @file grocery_bagging_bt.yaml
# @brief ROS2 parameters that configure grocery_bagging.xml blackboard values.

lerobot_bt_runner:
  ros__parameters:
    bt:
      initial_scene_ready_gate: "grocery_bagging.scene_0_ready"
      initial_scene_ready_max_attempts: -1
      bag_rigid_or_cylindrical_item_skill: "bag_rigid_or_cylindrical_item"
      bag_rigid_or_cylindrical_item_timeout_s: 120.0
      bag_rigid_or_cylindrical_item_max_attempts: 3
      bag_flat_or_long_item_skill: "bag_flat_or_long_item"
      bag_flat_or_long_item_timeout_s: 120.0
      bag_flat_or_long_item_max_attempts: 3
      bag_soft_or_fragile_item_skill: "bag_soft_or_fragile_item"
      bag_soft_or_fragile_item_timeout_s: 120.0
      bag_soft_or_fragile_item_max_attempts: 3
      task_complete_gate: "grocery_bagging.task_complete"
      task_complete_max_attempts: -1
