# @file items_in_drawer_bt.yaml
# @brief ROS2 parameters that configure items_in_drawer.xml blackboard values.

lerobot_bt_runner:
  ros__parameters:
    bt:
      initial_scene_ready_gate: "items_in_drawer.scene_0_ready"
      initial_scene_ready_max_attempts: 3
      drawer_open_gate: "items_in_drawer.drawer_open_ready"
      drawer_open_gate_max_attempts: 3
      insert_next_drawer_item_skill: "insert_next_drawer_item"
      insert_next_drawer_item_timeout_s: 60.0
      insert_next_drawer_item_max_attempts: 3
      drawer_closed_gate: "items_in_drawer.drawer_closed"
      drawer_closed_gate_max_attempts: 3
      task_complete_gate: "items_in_drawer.task_complete"
      task_complete_max_attempts: 3
