# @file make_coffee_bt.yaml
# @brief ROS2 parameters that configure make_coffee.xml blackboard values.

lerobot_bt_runner:
  ros__parameters:
    bt:
      initial_scene_ready_gate: "make_coffee.scene_0_ready"
      initial_scene_ready_max_attempts: -1
      cup_under_dispenser_gate: "make_coffee.cup_under_dispenser"
      cup_under_dispenser_max_attempts: -1
      pick_and_insert_capsule_skill: "pick_and_insert_capsule"
      pick_and_insert_capsule_timeout_s: 60.0
      pick_and_insert_capsule_max_attempts: -1
      close_coffee_machine_skill: "close_coffee_machine"
      close_coffee_machine_timeout_s: 10.0
      close_coffee_machine_max_attempts: -1
      human_press_start_button_gate: "make_coffee.human_press_start_button"
      human_press_start_button_max_attempts: -1
