robot:
  type: custom_manipulator
  arm:
    type: panda
    # use_delta_actions: true
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30
      publish_ros_topic: true
      ros_topic: /left/rgb
      ros_transport: compressed
      ros_jpeg_quality: 60

teleop:
  type: metaquest_rail

teleop_action_processor:
  steps:
    - clutch_processor
    # - arm_absolute_to_delta

# policy:
#   type: smolvla
#   pretrained_path: steb6/smolvla_roboarena_HRII
#   device: cuda
#   # n_action_steps: 16
#   # compile_model: true

policy:
  type: act
  pretrained_path: steb6/act_roboarena_HRII_with_mi
  device: cuda
  n_action_steps: 16
  chunk_size: 16

ros_environment_state:
  enabled: true
  topics:
    - topic: /hand_center
      message_type: geometry_msgs.msg.PointStamped
      value_fields: [point.x, point.y]
      output_keys: [rob_x, rob_y]
    - topic: /obj_1_center
      message_type: geometry_msgs.msg.PointStamped
      value_fields: [point.x, point.y]
      output_keys: [obj_x, obj_y]
    - topic: /ksg_mi
      message_type: std_msgs.msg.Float64
      value_fields: [data]
      output_keys: [mi_mine]

dataset:
  repo_id: steb6/eval_act_roboarena_HRII_with_mi
  single_task: Pick the metal block and put it in the box.
  fps: 10
  episode_time_s: 2000
  reset_time_s: 0
  num_episodes: 5
  video: true
  push_to_hub: true
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

teleop_recording_mode: all  # corrections_only, all
display_data: true
play_sounds: true
resume: true
