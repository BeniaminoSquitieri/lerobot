robot:
  type: custom_manipulator
  arm:
    type: panda
    # use_delta_actions: true
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

teleop:
  type: metaquest_rail

teleop_action_processor:
  steps:
    - clutch_processor
    # - arm_absolute_to_delta

policy:
  type: groot
  pretrained_path: steb6/groot_hello_world
  device: cuda
  n_action_steps: 16
  chunk_size: 16

dataset:
  repo_id: steb6/eval_groot_pick_bread_dagger
  root: outputs/eval_groot_pick_bread_dagger
  single_task: Pick.
  fps: 10
  episode_time_s: 12000
  reset_time_s: 0
  num_episodes: 100
  video: true
  push_to_hub: true
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

# display_data: true
play_sounds: true
resume: true
