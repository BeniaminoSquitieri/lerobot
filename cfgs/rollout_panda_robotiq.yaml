policy:
  type: act
  pretrained_path: steb6/act_roboarena_HRII
  device: cuda
  n_action_steps: 16
  chunk_size: 16

dataset:
  repo_id: HSP-IIT/eval_smolvla_default_toast_prep
  single_task: Pick the metal block and put it in the box.
  fps: 10
  episode_time_s: 12000
  reset_time_s: 0
  num_episodes: 100
  video: true
  push_to_hub: true
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

# display_data: true
play_sounds: true
resume: false
