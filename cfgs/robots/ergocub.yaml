robot:
  type: ergocub
  remote_prefix: /ergocub
  local_prefix: /lerobot
  cameras:
    egocentric:
      type: yarp
      yarp_name: depthCamera/rgbImage:o
      width: 640
      height: 480
      fps: 30
  control_boards: []
  state_boards: [bimanual, head, fingers, xela_right]
  xela_force_visualization_scale: [0.001, 0.001, 0.001]
  position_tolerance: 0.12
