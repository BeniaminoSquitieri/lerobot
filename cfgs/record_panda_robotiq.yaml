robot:
  type: custom_manipulator
  arm:
    type: panda
    # DECOMMENT TO USE DELTA ACTIONS
    # use_delta_actions: true
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30
      # DECOMMENT TO PUBLISH IMAGES AS ROS TOPIC
      # publish_ros_topic: true
      # ros_topic: /topic

dataset:
  repo_id: steb6/hello_world
  single_task: Pick the metal block and put it in the box.
  fps: 10
  episode_time_s: 2000
  reset_time_s: 0
  num_episodes: 5
  video: true
  push_to_hub: true
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

# DECOMMENT TO USE DAGGER
# teleop:
#   type: metaquest_rail
# teleop_action_processor:
#   steps: [clutch_processor]  #, arm_absolute_to_delta]
# teleop_recording_mode: all  # corrections_only, all

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

teleop_recording_mode: corrections_only

display_data: true
play_sounds: true
resume: true

policy:
  type: smolvla
  pretrained_path: steb6/smolvla_roboarena_HRII
  device: cuda
  n_action_steps: 16
  chunk_size: 16

policy_server:
  server_address: 192.168.100.174:8080
  actions_per_chunk: 16
  chunk_size_threshold: 0.25
  aggregate_fn_name: latest_only
  client_device: cpu
  debug_visualize_queue_size: true

