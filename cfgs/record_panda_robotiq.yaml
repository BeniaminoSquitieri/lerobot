robot:
  type: custom_manipulator
  arm:
    type: panda
    # DECOMMENT TO USE DELTA ACTIONS
    # use_delta_actions: true
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30
      # DECOMMENT TO PUBLISH IMAGES AS ROS TOPIC
      # publish_ros_topic: true
      # ros_topic: /topic

dataset:
  repo_id: Squitieri/eval_act_pick_place_2nd
    # repo_id: Squitieri/eval_breakfast_pick_cereal_act_chunk16_exec16_20k
  single_task: Pick the toast. 
  fps: 10
  episode_time_s: 2000
  reset_time_s: 0
  num_episodes: 16
  video: true
  push_to_hub: true
  private: true
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}
  force_cache_sync: true

# # DECOMMENT TO USE DAGGER
# teleop:
#   type: metaquest_rail
# teleop_action_processor:
#   steps: [clutch_processor]  #, arm_absolute_to_delta]

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

# teleop_recording_mode: corrections_only

display_data: true
play_sounds: true
resume: false

# policy:
#   type: smolvla
#   pretrained_path: Squitieri/close_machine_smolvla_bs8_5k
#   device: cuda
#   chunk_size: 50
#   n_action_steps: 16
#   load_vlm_weights: false
#   compile_model: false
#   use_amp: false
  

policy:
  type: act
  pretrained_path: Squitieri/act_pick_place_2nd
  device: cuda
  
  # Must match the pretrained ACT checkpoint architecture.
  n_action_steps: 16
  chunk_size: 16

