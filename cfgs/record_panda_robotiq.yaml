robot:
  type: custom_manipulator
  arm:
    type: panda
    # use_delta_actions: true
    visualize: true
  gripper:
    type: robotiq
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "909522060544"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

teleop:
  type: metaquest_rail
  gripper_deadzone: 0.05
  invert_gripper_trigger: true

dataset:
  repo_id: HSP-IIT/put_coffee
  single_task: Place the cup in the coffee machine.
  fps: 10
  episode_time_s: 2000
  reset_time_s: 0
  num_episodes: 10
  video: true
  push_to_hub: true
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

teleop_action_processor:
  steps:
    - registry_name: clutch_processor
      config:
        translation_scale: 0.35
        rotation_scale: 0.8
        max_translation_m: 0.12
        max_rotation_rad: 0.5
        translation_deadzone_m: 0.002
        rotation_deadzone_rad: 0.02

robot_action_processor:
  steps:
    - registry_name: cartesian_action_safety_processor
      config:
        max_translation_m: 0.02
        max_rotation_rad: 0.18
        mode: clip

robot_observation_processor:
  steps: []

display_data: true
control_fps: 30
play_sounds: true
resume: false
