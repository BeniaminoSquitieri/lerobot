robot:
  type: custom_manipulator
  arm:
    type: panda
    # use_delta_actions: true
    visualize: true
  gripper:
    type: xhand
    # use_delta_actions: true
    read_tactile_sensors: true
    visualize: true
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: "943222071614"
      use_depth: false
      width: 640
      height: 480
      fps: 30
    left:
      type: intelrealsense
      serial_number_or_name: "123622270882"
      use_depth: false
      width: 640
      height: 480
      fps: 30

# teleop:
#   type: metareader

# teleop_action_processor:
#   steps:
#     - clutch_processor
#     # - arm_absolute_to_delta
#     # - hand_absolute_to_delta

policy:
  type: groot
  pretrained_path: HSP-IIT/groot_xhand_first_test
  device: cuda

dataset:
  repo_id: HSP-IIT/eval_xhand_first_test
  root: outputs/eval_xhand_first_test
  single_task: Perform the task.
  fps: 10
  episode_time_s: 12000
  reset_time_s: 0
  num_episodes: 1
  video: true
  push_to_hub: false
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

display_data: false
play_sounds: true
resume: false
