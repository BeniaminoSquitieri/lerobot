robot:
  type: ergocub
  remote_prefix: /ergocub
  local_prefix: /lerobot
  cameras:
    egocentric:
      type: yarp
      yarp_name: depthCamera/rgbImage:o
      width: 640
      height: 480
      fps: 30
  # Match the 24D state/action spaces expected by HSP-IIT/groot-HRI3.
  control_boards: [bimanual, head]
  state_boards: [bimanual, head]
  xela_force_visualization_scale: [0.001, 0.001, 0.001]
  position_tolerance: 0.15

policy:
  type: groot
  pretrained_path: HSP-IIT/groot-HRI3
  base_model_path: nvidia/GR00T-N1.5-3B
  device: cuda
  use_amp: false
  n_obs_steps: 1
  chunk_size: 16
  n_action_steps: 16
  max_state_dim: 64
  max_action_dim: 32
  image_size: [224, 224]
  tokenizer_assets_repo: lerobot/eagle2hg-processor-groot-n1p5
  embodiment_tag: new_embodiment
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  use_bf16: true

dataset:
  repo_id: HSP-IIT/eval_groot-HRI3
  root: outputs/eval_groot-HRI3
  single_task: Interact with the human.
  fps: 10
  episode_time_s: 30000
  reset_time_s: 0
  num_episodes: 1
  video: true
  push_to_hub: false
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

display_data: true
display_compressed_images: true
display_fps: 10
play_sounds: true
resume: false
